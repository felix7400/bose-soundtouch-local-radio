name: Temporary Provenance release bridge
on:
  push:
    branches:
      - support/provenance-data-bridge-20260920
permissions:
  contents: write
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve and download verified public data ZIP
        shell: bash
        run: |
          set -euo pipefail
          OUT="provenance-v21-public-data-20260920.zip"
          UA="Mozilla/5.0"
          BL="en-US"

          curl -fsS -A "$UA" -X POST https://api.gofile.io/accounts > /tmp/gofile-account.json
          TOKEN="$(python3 -c 'import json; print(json.load(open("/tmp/gofile-account.json"))["data"]["token"])')"
          curl -fsS -A "$UA" https://gofile.io/js/wt.obf.js -o /tmp/wt.obf.js
          WT="$(TOKEN="$TOKEN" node -e "const fs=require('fs'); Object.defineProperty(globalThis,'navigator',{value:{userAgent:'Mozilla/5.0',language:'en-US',platform:'Linux x86_64',hardwareConcurrency:8},configurable:true}); eval(fs.readFileSync('/tmp/wt.obf.js','utf8')); process.stdout.write(generateWT(process.env.TOKEN));")"

          API="https://api.gofile.io/contents/uIJyLUaX?page=1&pageSize=100&sortField=createTime&sortDirection=-1"
          curl -fsS -A "$UA" -H "Authorization: Bearer $TOKEN" -H "X-Website-Token: $WT" -H "X-BL: $BL" "$API" > /tmp/gofile-meta.json
          LINK="$(python3 -c 'import json; d=json.load(open("/tmp/gofile-meta.json")); xs=[v for v in d["data"]["children"].values() if v.get("name")=="provenance-v21-public-data-20260920.zip"]; assert len(xs)==1; print(xs[0]["link"])')"

          curl -L --fail --retry 8 --retry-delay 5 --connect-timeout 30 --max-time 7200 -A "$UA" -H "Authorization: Bearer $TOKEN" -H "X-Website-Token: $WT" -H "X-BL: $BL" -o "$OUT" "$LINK"
          test "$(stat -c %s "$OUT")" = "4927874568"
          echo "739d0df53a5efff31e55db200c4624bca4c938e1d5e031079bab12917a90ad10  $OUT" | sha256sum -c -
          unzip -t "$OUT" >/dev/null

          mkdir unpack
          unzip -q "$OUT" -d unpack
          cd unpack
          echo "af2be47f7477cf32fa6e4bec1c6a4868  NadigOConner2024_hepg2.h5ad" | md5sum -c -
          echo "d8b05d00bfbd686d37ffdd4293bc6c8c  NadigOConner2024_jurkat.h5ad" | md5sum -c -
          echo "d8cba17576d1a8afc0f7d71b79cad0f7  ReplogleWeissman2022_K562_essential.h5ad" | md5sum -c -
          echo "cc7f1ec50aeb3a3e1b4a6cfa713d80fa  ReplogleWeissman2022_rpe1.h5ad" | md5sum -c -

      - name: Publish temporary release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="provenance-data-bridge-20260920"
          gh release delete "$TAG" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "Temporary Provenance public data bridge" --notes "Temporary bridge for public scPerturb benchmark data. May be deleted after transfer."
          gh release upload "$TAG" --repo "${GITHUB_REPOSITORY}" \
            unpack/ReplogleWeissman2022_K562_essential.h5ad \
            unpack/ReplogleWeissman2022_rpe1.h5ad \
            unpack/NadigOConner2024_hepg2.h5ad \
            unpack/NadigOConner2024_jurkat.h5ad \
            unpack/MANIFEST.txt
          gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" --json url,assets
