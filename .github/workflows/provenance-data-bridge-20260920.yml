name: Temporary Provenance chunk bridge
on:
  push:
    branches:
      - support/provenance-data-bridge-20260920
permissions:
  contents: read
  actions: write
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Download prior verified artifact and split
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID="10604131455"
          API="https://api.github.com/repos/felix7400/bose-soundtouch-local-radio/actions/artifacts/$ARTIFACT_ID/zip"
          curl -L --fail --retry 5 --connect-timeout 30 --max-time 7200 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o /tmp/bridge-artifact.zip "$API"
          mkdir -p /tmp/bridge-unpack parts
          unzip -q /tmp/bridge-artifact.zip -d /tmp/bridge-unpack
          SRC="/tmp/bridge-unpack/provenance-v21-public-data-20260920.zip"
          test "$(stat -c %s "$SRC")" = "4927874568"
          echo "739d0df53a5efff31e55db200c4624bca4c938e1d5e031079bab12917a90ad10  $SRC" | sha256sum -c -
          unzip -t "$SRC" >/dev/null

          split -b 450M -d -a 2 "$SRC" "parts/provenance-v21-public-data-20260920.zip.part-"
          test "$(find parts -type f -name 'provenance-v21-public-data-20260920.zip.part-*' | wc -l)" = "11"
          sha256sum parts/* > parts/parts.sha256
          cat parts/parts.sha256
          du -h parts/*

          curl -fsS -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/felix7400/bose-soundtouch-local-radio/actions/artifacts/$ARTIFACT_ID"
          echo "Deleted oversized bridge artifact $ARTIFACT_ID"

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: provenance-v21-part-00
          path: parts/provenance-v21-public-data-20260920.zip.part-00
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: provenance-v21-part-01
          path: parts/provenance-v21-public-data-20260920.zip.part-01
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: provenance-v21-part-02
          path: parts/provenance-v21-public-data-20260920.zip.part-02
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: provenance-v21-part-03
          path: parts/provenance-v21-public-data-20260920.zip.part-03
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: provenance-v21-part-04
          path: parts/provenance-v21-public-data-20260920.zip.part-04
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with:
          name: provenance-v21-part-05
          path: parts/provenance-v21-public-data-20260920.zip.part-05
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 06
        uses: actions/upload-artifact@v4
        with:
          name: provenance-v21-part-06
          path: parts/provenance-v21-public-data-20260920.zip.part-06
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 07
        uses: actions/upload-artifact@v4
        with:
          name: provenance-v21-part-07
          path: parts/provenance-v21-public-data-20260920.zip.part-07
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 08
        uses: actions/upload-artifact@v4
        with:
          name: provenance-v21-part-08
          path: parts/provenance-v21-public-data-20260920.zip.part-08
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 09
        uses: actions/upload-artifact@v4
        with:
          name: provenance-v21-part-09
          path: parts/provenance-v21-public-data-20260920.zip.part-09
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 10
        uses: actions/upload-artifact@v4
        with:
          name: provenance-v21-part-10
          path: parts/provenance-v21-public-data-20260920.zip.part-10
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload parts manifest
        uses: actions/upload-artifact@v4
        with:
          name: provenance-v21-parts-manifest
          path: parts/parts.sha256
          retention-days: 1
          if-no-files-found: error
