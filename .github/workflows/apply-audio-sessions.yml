name: Apply audio sessions

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/zimmeros-audio-sessions
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Integrate audio session routes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/main.py')
          text = path.read_text()
          import_anchor = 'from .auth import OptionalBasicAuthMiddleware\n'
          if 'from .audio_sessions import register_audio_session_routes\n' not in text:
              if import_anchor not in text:
                  raise SystemExit('main.py auth import anchor not found')
              text = text.replace(import_anchor, 'from .audio_sessions import register_audio_session_routes\n' + import_anchor, 1)
          route_anchor = '\n\nif FRONTEND_DIST.exists():\n'
          route_call = '\n\nregister_audio_session_routes(app, _speaker_client, storage)\n'
          if 'register_audio_session_routes(app, _speaker_client, storage)' not in text:
              if route_anchor not in text:
                  raise SystemExit('main.py frontend anchor not found')
              text = text.replace(route_anchor, route_call + route_anchor, 1)
          path.write_text(text)
          PY
          rm -rf bootstrap-audio-sessions

      - name: Install and test backend
        run: |
          set -o pipefail
          cd backend
          {
            pip install -r requirements.txt
            python -m compileall -q app tests
            PYTHONPATH=. pytest -q
          } 2>&1 | tee /tmp/audio-session-tests.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-session-tests
          path: /tmp/audio-session-tests.log
          if-no-files-found: warn

      - name: Commit and push implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add serialized SoundTouch audio sessions'
          git push origin HEAD:feat/zimmeros-audio-sessions
