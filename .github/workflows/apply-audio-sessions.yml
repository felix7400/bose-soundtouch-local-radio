name: Apply audio sessions

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/zimmeros-audio-sessions
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Apply readable integration patch
        run: |
          set -euo pipefail
          git apply --check --verbose bootstrap-audio-sessions/main.patch
          git apply bootstrap-audio-sessions/main.patch
          rm -rf bootstrap-audio-sessions

      - name: Install and test backend
        run: |
          set -o pipefail
          cd backend
          pip install -r requirements.txt
          python -m compileall -q app tests
          pytest -q

      - name: Commit and push implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add serialized SoundTouch audio sessions'
          git push origin HEAD:feat/zimmeros-audio-sessions
